[project]
name = "bnc-terrain"
version = "0.1.0"
description = "Brave and Cold terrain pipeline: real lidar DEM -> stylized playable heightmap + masks for Terrain3D"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "rasterio>=1.4",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bnc_terrain"]
